[project]
name = "rpg-player"
version = "0.2.0"
description = "A small toy project for playing & narrating RPG-style messages"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Lyndon Armitage" }]
dependencies = [
  "elevenlabs>=2.15.0",
  "jinja2>=3.1.6",
  "ollama>=0.6.0",
  "openai>=1.99.9",
  "piper-tts>=1.3.0",
  "python-dotenv>=1.1.1",
  "pyttsx3>=2.99",
  "sounddevice>=0.5.2",
  "soundfile>=0.13.1",
  "textual>=5.3.0",
  "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.40.0",
  "black>=26.5.1",
  "isort>=5.12.0",
  "prek>=0.5.2",
  "pytest>=8.4.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.6",
  "textual-dev>=1.7.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"

[tool.pytest]
addopts = ["-ra", "-q"]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["typings"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "I",
  "UP006",  # non-pep585-annotation (List → list, etc.)
  "UP007",  # non-pep604-annotation-union (Union → |)
  "UP045",  # non-pep604-annotation-optional (Optional → | None)
]
ignore = ["E501"]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
cache-dir = ".uv-cache"
